# Push a tag v<version> (matching manifest.json) to publish: the bundle is built on each kind of machine and
# attached to the GitHub release with its checksum, next to manifest.json. AgentOrch downloads
# releases/latest/download/manifest.json, then voice-<target>.tar.gz for the user's machine. No model is in it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python tools/build.py --tag "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* manifest.json --title "$GITHUB_REF_NAME" --generate-notes
